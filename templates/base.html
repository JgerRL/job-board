<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{{ title if title else "Niche Job Board" }}</title>
  <meta name="description" content="Curated remote junior developer jobs." />

  <!-- Tailwind CDN (fine for MVP; swap to a build step later) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="icon" href="/static/favicon.png" />
</head>
<body class="bg-gray-50 text-gray-900">
  <header class="border-b bg-white">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="/" class="font-semibold text-lg">Niche Job Board</a>
      <nav class="text-sm text-gray-600">
        <a href="/" class="hover:text-black">Jobs</a>
      </nav>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
  </main>

  <footer class="mt-12 border-t bg-white">
    <div class="max-w-5xl mx-auto px-4 py-6 text-sm text-gray-500">
      © {{ (now().year) if now else "" }} Niche Job Board • Updated daily
    </div>
  </footer>
</body>
</html>
